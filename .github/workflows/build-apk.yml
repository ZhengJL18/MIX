# Build APK and publish GitHub Release on every push to master.
# The app checks the latest release on startup and self-updates.
name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # 发 GitHub Release 需要 contents: write（仓库默认 token 是 read-only）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/flutter_test.log

      # 测试失败时把详情以 ::error:: 写入 annotations（日志正文需登录才能看，
      # 这里把关键行暴露到可匿名读取的 annotations 上，方便诊断 CI）。
      # 注意：失败可能是断言失败（Expected/Actual）也可能是异常（Exception/
      # 堆栈），flutter test 的 compact reporter 会把失败详情集中打印在日志
      # 尾部，所以同时抓 grep 上下文 + tail 尾部。
      - name: Expose test failure details
        if: failure()
        run: |
          grep -n -A 30 -E "\[E\]|Expected:|Actual:|Which:|Exception|Test failed|type '|test/.*\(failed\)" /tmp/flutter_test.log \
            | head -200 | sed 's/^/::error::/' || true
          echo "=====TAIL====="
          tail -120 /tmp/flutter_test.log | sed 's/^/::error::/' || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: /tmp/flutter_test.log

      # release 构建：用仓库内的 jailer-release.jks 固定签名（debug/release 同签名，
      # 覆盖安装不丢数据）。--build-number 用 github.run_number 单调递增 →
      # versionCode 每次 push 必升，App 端据此检测到新版本。
      # --target-platform android-arm64：只打 arm64-v8a，放弃 32 位老机型
      # 与 x86 模拟器，APK 体积减半以上（ABI 是乘数，原生库每个 ABI 各一份）。
      # 代码执行全部走云端（RemoteCodeEngine POST 到用户服务器），
      # APK 不再内嵌 CPython/serious_python/libtcc 运行时。
      - name: Build APK (release)
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # push 才发 release（PR 只构建验证不发布）。
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0+${{ github.run_number }}
          name: Hermes v1.0.0+${{ github.run_number }}
          body: |
            自动构建发布（commit ${{ github.sha }}）

            ${{ github.event.head_commit.message }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  # Linux 桌面版：flutter build linux + dpkg-deb 打包（与 APK 并行）。
  # flutter_inappwebview 无 Linux 实现，WebView 功能已平台降级（mermaid/
  # 网页抓取/登录）；agent 有终端工具（run_terminal）可替代。
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 生成 Linux 平台壳（首次构建必需；不会覆盖现有文件）。
      - name: Generate Linux platform files
        run: flutter create --platforms=linux .

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libbz2-dev

      - name: Build Linux (release)
        run: flutter build linux --release

      # 打 deb 包：拼 DEBIAN/control + 可执行文件 + .desktop。
      - name: Package deb
        run: |
          VERSION=${{ github.run_number }}
          PKG=build/linux/pkg
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/mix" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -r build/linux/x64/release/bundle/* "$PKG/opt/mix/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: mix
          Version: 1.0.0+$VERSION
          Architecture: amd64
          Maintainer: MIX <zhengjl18@users.noreply.github.com>
          Depends: libgtk-3-0, libstdc++6
          Description: MIX - AI 学习助手（聊天 / 笔记库 / 云端与本地代码执行）
          EOF
          cat > "$PKG/usr/bin/mix" <<EOF
          #!/bin/sh
          exec /opt/mix/mix "\$@"
          EOF
          chmod +x "$PKG/usr/bin/mix"
          cat > "$PKG/usr/share/applications/mix.desktop" <<EOF
          [Desktop Entry]
          Name=MIX
          Comment=AI 学习助手
          Exec=/opt/mix/mix
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          dpkg-deb --build --root-owner-group "$PKG" build/linux/mix_1.0.0+${VERSION}_amd64.deb

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-linux-deb
          path: build/linux/mix_*.deb

      # push 才发 release（PR 只构建验证）。用 update_release 追加 deb 到同一 tag。
      - name: Publish Linux deb to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0+${{ github.run_number }}
          update_release: true
          files: build/linux/mix_*.deb
