# Build APK and publish GitHub Release on every push to master.
# The app checks the latest release on startup and self-updates.
name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # 发 GitHub Release 需要 contents: write（仓库默认 token 是 read-only）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter_analyze.log

      # analyze 失败时把错误详情暴露到公开 annotations（日志正文需登录才能看）。
      - name: Expose analyze details
        if: failure()
        run: |
          grep -n -E "error" /tmp/flutter_analyze.log | head -60 | sed 's/^/::error::/' || true
          echo "=====ANALYZE TAIL====="
          tail -40 /tmp/flutter_analyze.log | sed 's/^/::error::/' || true

      - name: Run tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/flutter_test.log

      # 测试失败时把详情以 ::error:: 写入 annotations（日志正文需登录才能看，
      # 这里把关键行暴露到可匿名读取的 annotations 上，方便诊断 CI）。
      - name: Expose test failure details
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          try:
              log = open('/tmp/flutter_test.log').read()
          except FileNotFoundError:
              log = ''
          chunks = []
          # compact reporter 的失败块（[E] 开头，到空行结束）。
          for m in re.finditer(r'\[E\].*?(?=\n\n|\Z)', log, re.S):
              chunks.append(m.group(0)[:1600])
          # 编译/加载失败。
          if not chunks:
              for m in re.finditer(r'(Failed to load|Compilation failed|Error:).*?(?=\n\n|\Z)', log, re.S):
                  chunks.append(m.group(0)[:1600])
          if not chunks:
              tail = log[-4000:]
              chunks.append(tail)
          for i, c in enumerate(chunks[:10]):
              print(f'::error::--- test failure {i+1} ---\n{c}')
          EOF

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: /tmp/flutter_test.log

      # release 构建：用仓库内的 jailer-release.jks 固定签名（debug/release 同签名，
      # 覆盖安装不丢数据）。--build-number 用 github.run_number 单调递增 →
      # versionCode 每次 push 必升，App 端据此检测到新版本。
      # --target-platform android-arm64：只打 arm64-v8a，放弃 32 位老机型
      # 与 x86 模拟器，APK 体积减半以上（ABI 是乘数，原生库每个 ABI 各一份）。
      # 代码执行全部走云端（RemoteCodeEngine POST 到用户服务器），
      # APK 不再内嵌 CPython/serious_python/libtcc 运行时。
      - name: Build APK (release)
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # push 才发 release（PR 只构建验证不发布）。
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0+${{ github.run_number }}
          name: Hermes v1.0.0+${{ github.run_number }}
          body: |
            自动构建发布（commit ${{ github.sha }}）

            ${{ github.event.head_commit.message }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
